[project]
name = "aml-projects"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "datasets>=5.1.0",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "nbstripout>=0.9.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
